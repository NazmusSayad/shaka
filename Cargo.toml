[package]
name = "shaka"
edition = "2024"
version = "0.0.6"
readme = "README.md"
license = "MIT"
description = "Generate shell aliases and functions from a JSON config file"
repository = "https://github.com/NazmusSayad/shaka"
homepage = "https://github.com/NazmusSayad/shaka"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
